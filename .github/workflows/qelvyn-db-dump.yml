name: qelvyn-db-dump (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database to JSON
        run: |
          mkdir -p /tmp/qdump && cd /tmp/qdump && npm init -y >/dev/null 2>&1 && npm install pg --no-audit --no-fund
          cat > /tmp/qdump/dump.mjs <<'DUMPEOF'
          import { Client } from 'pg';
          import fs from 'node:fs';
          const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
          await client.connect();
          const tables = (await client.query("SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename")).rows.map(r => r.tablename);
          const size = await client.query("SELECT pg_size_pretty(pg_database_size(current_database())) AS s, pg_database_size(current_database()) AS b");
          const out = { size: size.rows[0], tables: {}, sequences: {} };
          for (const t of tables) {
            const rows = (await client.query('SELECT * FROM "public"."' + t + '"')).rows;
            out.tables[t] = rows;
          }
          const seqs = (await client.query("SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema='public'")).rows;
          for (const s of seqs) {
            const v = await client.query('SELECT last_value FROM "' + s.sequence_name + '"');
            out.sequences[s.sequence_name] = v.rows[0].last_value;
          }
          fs.writeFileSync('/tmp/qdump/dump.json', JSON.stringify(out));
          console.log('DUMPED size=' + JSON.stringify(size.rows[0]) + ' tables=' + Object.keys(out.tables).map(t => t + ':' + out.tables[t].length).join(','));
          await client.end();
          DUMPEOF
          cd /tmp/qdump && node dump.mjs
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      - name: Encrypt and upload
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/qdump/dump.json -out /tmp/qdump/dump.json.enc -pass pass:"${{ secrets.DUMP_PASSPHRASE }}"
          ls -l /tmp/qdump/dump.json.enc
      - uses: actions/upload-artifact@v4
        with:
          name: qelvyn-db-dump
          path: /tmp/qdump/dump.json.enc
          if-no-files-found: error
