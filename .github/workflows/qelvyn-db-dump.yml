name: qelvyn-db-dump (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Postgres SSLRequest path
        run: |
          cat > /tmp/probe.mjs <<'PROBEEOF'
          import net from 'node:net';
          const host = 'dpg-db6j6ujrjlhs73f1apa0-a.singapore-postgres.render.com';
          const sock = net.connect(5432, host);
          sock.setTimeout(8000);
          sock.on('connect', () => {
            console.log('TCP connected, sending SSLRequest');
            sock.write(Buffer.from([0, 0, 0, 8, 4, 210, 22, 47]));
          });
          sock.on('data', (d) => { console.log('SSLRequest reply bytes:', [...d], 'as text:', JSON.stringify(d.toString('utf8'))); sock.destroy(); });
          sock.on('timeout', () => { console.log('probe: no reply within 8s'); sock.destroy(); });
          sock.on('error', (e) => { console.log('probe error:', e.message); });
          sock.on('close', () => { console.log('probe socket closed'); });
          PROBEEOF
          node /tmp/probe.mjs
      - name: Dump database to JSON
        run: |
          mkdir -p /tmp/qdump && cd /tmp/qdump && npm init -y >/dev/null 2>&1 && npm install pg --no-audit --no-fund
          cat > /tmp/qdump/dump.mjs <<'DUMPEOF'
          import { Client } from 'pg';
          import fs from 'node:fs';
          const u = new URL(process.env.DATABASE_URL);
          console.log('connecting direct-TLS to host=' + u.hostname);
          const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { servername: u.hostname, rejectUnauthorized: false }, sslnegotiation: 'direct' });
          try {
            await client.connect();
            console.log('connected OK');
          } catch (e) {
            console.log('CONNECT-ERROR name=' + e.name + ' message=' + e.message + ' code=' + e.code);
            throw e;
          }
          const tables = (await client.query("SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename")).rows.map(r => r.tablename);
          const size = await client.query("SELECT pg_size_pretty(pg_database_size(current_database())) AS s, pg_database_size(current_database()) AS b");
          const out = { size: size.rows[0], tables: {}, sequences: {} };
          for (const t of tables) {
            const rows = (await client.query('SELECT * FROM "public"."' + t + '"')).rows;
            out.tables[t] = rows;
          }
          const seqs = (await client.query("SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema='public'")).rows;
          for (const s of seqs) {
            const v = await client.query('SELECT last_value FROM "' + s.sequence_name + '"');
            out.sequences[s.sequence_name] = v.rows[0].last_value;
          }
          fs.writeFileSync('/tmp/qdump/dump.json', JSON.stringify(out));
          console.log('DUMPED size=' + JSON.stringify(size.rows[0]) + ' tables=' + Object.keys(out.tables).map(t => t + ':' + out.tables[t].length).join(','));
          await client.end();
          DUMPEOF
          cd /tmp/qdump && node dump.mjs
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      - name: Encrypt and upload
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/qdump/dump.json -out /tmp/qdump/dump.json.enc -pass pass:"${{ secrets.DUMP_PASSPHRASE }}"
          ls -l /tmp/qdump/dump.json.enc
      - uses: actions/upload-artifact@v4
        with:
          name: qelvyn-db-dump
          path: /tmp/qdump/dump.json.enc
          if-no-files-found: error
